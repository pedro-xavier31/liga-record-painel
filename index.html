<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Liga Record</title>
<style>
  :root {
    color-scheme: light;
    --bg-page:      #F2F5F1;
    --bg-surface:   #FFFFFF;
    --bg-surface-2: #EAF0EC;
    --border:       #D6E0D9;
    --text-1:       #12211A;
    --text-2:       #4B5C52;
    --text-muted:   #7C8B81;
    --accent:       #1B6B3A;
    --accent-strong:#0F4A28;
    --accent-soft:  #E3F0E7;
    --pos-gr:       #2a78d6;
    --pos-gr-bg:    #E4EEFB;
    --pos-def:      #eb6834;
    --pos-def-bg:   #FBE7DD;
    --pos-med:      #1baf7a;
    --pos-med-bg:   #DEF3EA;
    --pos-ata-bg:   #ECEDE9;
    --pos-ata-brd:  #B9C2BB;
    --home-bg:      #E3F0E7;
    --home-brd:     #BBD8C4;
    --shadow:       0 1px 2px rgba(18,33,26,0.06), 0 8px 24px -12px rgba(18,33,26,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page:      #0D1712;
      --bg-surface:   #16221B;
      --bg-surface-2: #1D2B22;
      --border:       #2A3A2F;
      --text-1:       #EDF3EE;
      --text-2:       #B7C4BB;
      --text-muted:   #7E9186;
      --accent:       #45C97C;
      --accent-strong:#6EDBA0;
      --accent-soft:  rgba(69,201,124,0.14);
      --pos-gr:       #3987e5;
      --pos-gr-bg:    rgba(57,135,229,0.16);
      --pos-def:      #d95926;
      --pos-def-bg:   rgba(217,89,38,0.18);
      --pos-med:      #199e70;
      --pos-med-bg:   rgba(25,158,112,0.18);
      --pos-ata-bg:   #212E25;
      --pos-ata-brd:  #3B4B41;
      --home-bg:      rgba(69,201,124,0.14);
      --home-brd:     rgba(69,201,124,0.35);
      --shadow:       0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-page:      #0D1712;
    --bg-surface:   #16221B;
    --bg-surface-2: #1D2B22;
    --border:       #2A3A2F;
    --text-1:       #EDF3EE;
    --text-2:       #B7C4BB;
    --text-muted:   #7E9186;
    --accent:       #45C97C;
    --accent-strong:#6EDBA0;
    --accent-soft:  rgba(69,201,124,0.14);
    --pos-gr:       #3987e5;
    --pos-gr-bg:    rgba(57,135,229,0.16);
    --pos-def:      #d95926;
    --pos-def-bg:   rgba(217,89,38,0.18);
    --pos-med:      #199e70;
    --pos-med-bg:   rgba(25,158,112,0.18);
    --pos-ata-bg:   #212E25;
    --pos-ata-brd:  #3B4B41;
    --home-bg:      rgba(69,201,124,0.14);
    --home-brd:     rgba(69,201,124,0.35);
    --shadow:       0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-page);
    color: var(--text-1);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ── Header ─────────────────────────────────────── */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding-bottom: 20px; margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header.top::after {
    content: ""; position: absolute; left: 0; bottom: -1px; width: 64px; height: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wordmark .mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(155deg, var(--accent), var(--accent-strong));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; letter-spacing: -0.02em;
    flex-shrink: 0; box-shadow: 0 4px 10px -3px rgba(15,74,40,0.5);
  }
  .wordmark h1 {
    margin: 0; font-size: 21px; font-weight: 800; letter-spacing: 0.01em;
    text-transform: uppercase; color: var(--text-1); line-height: 1.15;
  }
  .wordmark .sub {
    font-size: 12px; color: var(--text-muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.07em; margin-top: 1px;
  }
  .rounds { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .round-tab {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text-2);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em;
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .round-tab[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 2px 6px -2px rgba(15,74,40,0.5);
  }
  .round-tab:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }

  /* ── Stat tiles ─────────────────────────────────── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .stat {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 15px; position: relative; overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
    opacity: 0.7;
  }
  .stat .n {
    font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em; color: var(--text-1); line-height: 1.1;
  }
  .stat .l {
    font-size: 11px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 700; margin-top: 3px;
  }
  .stat .split {
    display: flex; height: 6px; border-radius: 3px; overflow: hidden;
    margin-top: 9px; background: var(--bg-surface-2);
  }
  .stat .split span:first-child { background: var(--accent); }
  .stat .split span:last-child { background: var(--border); }

  /* ── Toolbar ────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .search {
    position: relative; flex: 1 1 220px; min-width: 180px;
  }
  .search input {
    width: 100%; padding: 9px 12px 9px 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-1); font-size: 13.5px; font-family: inherit;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .55; }
  .chipgroup { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text-2);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong);
  }
  .chip:hover:not([aria-pressed="true"]) { border-color: var(--accent); }
  .viewtoggle {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .viewtoggle button {
    padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text-2);
    font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .viewtoggle button:hover:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }
  .viewtoggle button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 2px 6px -2px rgba(15,74,40,0.5);
  }

  /* ── Cards view ─────────────────────────────────── */
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 14px; }
  .team-card {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .team-card header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-surface-2);
  }
  .team-card header h2 { margin: 0; font-size: 14.5px; font-weight: 800; }
  .team-card header .coach { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
  .team-card header .count { font-size: 11.5px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .group-label {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); padding: 10px 16px 4px;
  }
  .player-row {
    display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center;
    gap: 10px; padding: 7px 16px; border-top: 1px solid var(--bg-surface-2);
  }
  .player-row:first-of-type { border-top: none; }
  .player-row.bench { opacity: 0.62; }
  .pos-tag {
    font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
    padding: 3px 0; border-radius: 5px; text-align: center;
    border: 1px solid transparent;
  }
  .pos-tag.gr  { background: var(--pos-gr-bg);  color: var(--pos-gr); }
  .pos-tag.def { background: var(--pos-def-bg); color: var(--pos-def); }
  .pos-tag.med { background: var(--pos-med-bg); color: var(--pos-med); }
  .pos-tag.ata { background: var(--pos-ata-bg); color: var(--text-1); border-color: var(--pos-ata-brd); }
  .pname { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .pname .n { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pname .c { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap {
    width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 9.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .fixture {
    font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; border: 1px solid var(--border); color: var(--text-2);
  }
  .fixture.casa { background: var(--home-bg); border-color: var(--home-brd); color: var(--accent-strong); }
  .fixture.none { visibility: hidden; }

  /* ── Table view ─────────────────────────────────── */
  .tablewrap {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
    overflow-x: auto; box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: var(--bg-surface-2);
    text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
    border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  thead th:hover { color: var(--accent); }
  thead th .arrow { margin-left: 3px; opacity: .5; }
  tbody td { padding: 8px 14px; border-bottom: 1px solid var(--bg-surface-2); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg-surface-2); }
  tbody tr.bench { color: var(--text-muted); }
  td.pos { width: 1%; }
  td.tit { text-align: center; }

  /* ── Vista "Formação" ───────────────────────────── */
  .form-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-tab {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text-2);
    font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .form-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pitch-wrap {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow);
  }
  .pitch-coach {
    font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; text-align: center;
  }
  /* O relvado usa cores fixas (não segue o tema) — representa um campo real. */
  .pitch {
    position: relative; overflow: hidden;
    background:
      repeating-linear-gradient(180deg, #2c8a4c 0px, #2c8a4c 42px, #32914f 42px, #32914f 84px);
    border: 2px solid rgba(255,255,255,0.55); border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), inset 0 30px 60px -40px rgba(0,0,0,0.35);
    min-height: 480px; padding: 26px 14px 26px;
    display: flex; flex-direction: column; justify-content: space-around; gap: 10px;
  }
  .pitch-mark { position: absolute; border-color: rgba(255,255,255,0.5); pointer-events: none; }
  .pitch-mark.halfway { left: 6%; right: 6%; top: 50%; height: 2px; background: rgba(255,255,255,0.5); }
  .pitch-mark.circle {
    left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px;
    border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
  }
  .pitch-mark.box {
    left: 30%; right: 30%; bottom: 10px; height: 58px;
    border: 2px solid rgba(255,255,255,0.5); border-bottom: none; border-radius: 6px 6px 0 0;
  }
  .pitch-row { display: flex; justify-content: space-evenly; align-items: center; position: relative; z-index: 1; flex: 1; }
  .pitch-player { display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 130px; }
  .shirt {
    width: 36px; height: 36px; border-radius: 9px; position: relative;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }
  .shirt.gr  { background: #2a78d6; }
  .shirt.def { background: #eb6834; }
  .shirt.med { background: #1baf7a; }
  .shirt.ata { background: #33332f; }
  .shirt-cap {
    position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; color: #0F4A28; font-size: 9px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.15);
  }
  .ptag {
    font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 128px;
  }
  .pclub {
    font-size: 9.5px; color: rgba(255,255,255,0.92); text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 128px;
    display: flex; align-items: center; gap: 3px; justify-content: center;
  }
  .pfix {
    font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 3px;
    background: rgba(255,255,255,0.22); flex-shrink: 0;
  }
  .pfix.casa { background: rgba(255,255,255,0.4); }

  /* ── Vista "Jornada (todas)" — grelha lado a lado ── */
  /* Cores fixas (não seguem o tema) — mimetizam a grelha do site oficial. */
  .grid-table { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
  .grid-table th, .grid-table td {
    padding: 6px 12px; border-bottom: 1px solid var(--bg-surface-2); text-align: left;
  }
  .grid-table thead th {
    position: sticky; top: 0; font-size: 12px; font-weight: 800; color: #14201A;
    text-transform: uppercase; letter-spacing: 0.02em; border-bottom: none;
  }
  .grid-table th.grid-pts { min-width: 44px; }
  .grid-table td.num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
  .grid-table .cap-mark {
    display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); color: #fff; font-size: 8.5px; font-weight: 800;
  }
  .grid-table tr.grid-coach td {
    background: var(--bg-surface-2); font-weight: 700; color: var(--text-2);
  }
  .grid-table tr.grid-bench td { color: var(--text-muted); }
  .grid-table tr.grid-spacer td { border-bottom: none; padding: 3px 0; }
  .grid-table tr.grid-total td {
    background: var(--bg-surface-2); font-weight: 800; text-transform: uppercase;
    font-size: 11px; letter-spacing: 0.04em; color: var(--text-2);
  }

  /* ── Vista "Classificação" ──────────────────────── */
  .rank-refresh { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .rank-refresh button {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text-2); font-size: 11.5px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .rank-refresh button:hover { border-color: var(--accent); color: var(--accent); }
  .pending-note {
    font-size: 12.5px; font-weight: 600; color: #8A5A00; background: #FDF3DC;
    border: 1px solid #F0DBA0; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pending-note { color: #F0C868; background: rgba(240,200,104,0.12); border-color: rgba(240,200,104,0.3); }
  }
  :root[data-theme="dark"] .pending-note { color: #F0C868; background: rgba(240,200,104,0.12); border-color: rgba(240,200,104,0.3); }
  .rank-section { margin-bottom: 22px; }
  .rank-section h3 {
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 0 0 8px;
  }
  .rank-row {
    display: grid; grid-template-columns: 30px 1fr auto; align-items: center;
    gap: 12px; padding: 10px 16px; border-top: 1px solid var(--bg-surface-2);
  }
  .rank-row:first-child { border-top: none; }
  .rank-pos {
    font-size: 13px; font-weight: 800; color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .rank-row:nth-child(2) .rank-pos { color: #C9A227; }
  .rank-name { font-weight: 700; font-size: 13.5px; }
  .rank-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  .rank-pts {
    font-size: 16px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
  }

  /* ── Vista "Em comum" ───────────────────────────── */
  .shared-row {
    display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center;
    gap: 10px; padding: 9px 16px; border-top: 1px solid var(--bg-surface-2);
  }
  .shared-row:first-child { border-top: none; }
  .owner-badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .owner-chip {
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--bg-surface-2); border: 1px solid var(--border); color: var(--text-2);
    white-space: nowrap;
  }
  .shared-count {
    font-size: 12px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
    min-width: 24px; text-align: right;
  }

  .empty {
    text-align: center; padding: 48px 20px; color: var(--text-muted);
    background: var(--bg-surface); border: 1px dashed var(--border); border-radius: 12px;
  }

  footer.note {
    margin-top: 28px; text-align: center; font-size: 11.5px; color: var(--text-muted);
  }

  @media (max-width: 640px) {
    .player-row { grid-template-columns: 30px 1fr auto; }
    .fixture { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="wordmark">
      <div class="mark">LR</div>
      <div>
        <h1>Liga Record</h1>
        <div class="sub">Painel de equipas</div>
      </div>
    </div>
    <div class="rounds" id="rounds"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="viewtoggle">
      <button id="viewRanking" aria-pressed="true">Classificação</button>
      <button id="viewGrelha" aria-pressed="false">Jogadores</button>
    </div>
  </div>

  <div id="content"></div>

  <footer class="note">Liga Record — extraído automaticamente. Dados referentes à ronda selecionada. · <a href="admin.html" style="color:inherit;">Admin</a></footer>
</div>

<script>
const DATA = {"Ronda 2": {"jogadores": [{"equipa": "David Xavier", "pos": "GR", "jogador": "SAMUEL SOARES", "clube": "Benfica", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "David Xavier", "pos": "GR", "jogador": "CHARLES", "clube": "V. Guimarães", "fixture": null, "titular": false, "capitao": false, "slot": 0}, {"equipa": "David Xavier", "pos": "DEF", "jogador": "DAHL", "clube": "Benfica", "fixture": "fora", "titular": true, "capitao": false, "slot": 2}, {"equipa": "David Xavier", "pos": "DEF", "jogador": "EDUARDO QUARESMA", "clube": "Sporting", "fixture": "casa", "titular": true, "capitao": false, "slot": 1}, {"equipa": "David Xavier", "pos": "DEF", "jogador": "MARTIM FERNANDES", "clube": "FC Porto", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "David Xavier", "pos": "DEF", "jogador": "ADRIAN BAJRAMI", "clube": "Sp. Braga", "fixture": null, "titular": false, "capitao": false, "slot": 1}, {"equipa": "David Xavier", "pos": "MED", "jogador": "RAPHAEL GUZZO", "clube": "Marítimo", "fixture": "fora", "titular": true, "capitao": false, "slot": 3}, {"equipa": "David Xavier", "pos": "MED", "jogador": "ZALAZAR", "clube": "Sporting", "fixture": "casa", "titular": true, "capitao": false, "slot": 2}, {"equipa": "David Xavier", "pos": "MED", "jogador": "FROHOLDT", "clube": "FC Porto", "fixture": "fora", "titular": true, "capitao": false, "slot": 1}, {"equipa": "David Xavier", "pos": "MED", "jogador": "CÁSERES", "clube": "Gil Vicente", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "David Xavier", "pos": "MED", "jogador": "NILE JOHN", "clube": "Moreirense", "fixture": null, "titular": false, "capitao": false, "slot": 2}, {"equipa": "David Xavier", "pos": "ATA", "jogador": "IOANNIDIS", "clube": "Sporting", "fixture": "casa", "titular": true, "capitao": true, "slot": 2}, {"equipa": "David Xavier", "pos": "ATA", "jogador": "JHON DURÁN", "clube": "Benfica", "fixture": "fora", "titular": true, "capitao": false, "slot": 1}, {"equipa": "David Xavier", "pos": "ATA", "jogador": "BEGRAOUI", "clube": "Estoril", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "David Xavier", "pos": "ATA", "jogador": "HÉCTOR HERNÁNDEZ", "clube": "Gil Vicente", "fixture": null, "titular": false, "capitao": false, "slot": 3}, {"equipa": "Equipa 2", "pos": "GR", "jogador": "DIOGO COSTA", "clube": "FC Porto", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "Equipa 2", "pos": "GR", "jogador": "BERNARDO FONTES", "clube": "Sp. Braga", "fixture": null, "titular": false, "capitao": false, "slot": 0}, {"equipa": "Equipa 2", "pos": "DEF", "jogador": "ELIMBI", "clube": "Gil Vicente", "fixture": "fora", "titular": true, "capitao": false, "slot": 2}, {"equipa": "Equipa 2", "pos": "DEF", "jogador": "MAXI ARAÚJO", "clube": "Sporting", "fixture": "casa", "titular": true, "capitao": false, "slot": 1}, {"equipa": "Equipa 2", "pos": "DEF", "jogador": "LAGERBIELKE", "clube": "Sp. Braga", "fixture": "casa", "titular": true, "capitao": false, "slot": 0}, {"equipa": "Equipa 2", "pos": "MED", "jogador": "ISSA DOUMBIA", "clube": "Sporting", "fixture": "casa", "titular": true, "capitao": false, "slot": 3}, {"equipa": "Equipa 2", "pos": "MED", "jogador": "FUKUI", "clube": "Arouca", "fixture": "casa", "titular": true, "capitao": false, "slot": 2}, {"equipa": "Equipa 2", "pos": "MED", "jogador": "BENI", "clube": "V. Guimarães", "fixture": "fora", "titular": true, "capitao": false, "slot": 1}, {"equipa": "Equipa 2", "pos": "MED", "jogador": "HOLSGROVE", "clube": "Estoril", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "Equipa 2", "pos": "ATA", "jogador": "FLÁVIO GONÇALVES", "clube": "Sporting", "fixture": "casa", "titular": true, "capitao": false, "slot": 2}, {"equipa": "Equipa 2", "pos": "ATA", "jogador": "PAU VICTOR", "clube": "Sp. Braga", "fixture": "casa", "titular": true, "capitao": false, "slot": 1}, {"equipa": "Equipa 2", "pos": "ATA", "jogador": "PAVLIDIS", "clube": "Benfica", "fixture": "fora", "titular": true, "capitao": false, "slot": 0}, {"equipa": "Equipa 2", "pos": "ATA", "jogador": "LUÍS GUILHERME", "clube": "Sporting", "fixture": null, "titular": false, "capitao": false, "slot": 3}], "treinadores": {"David Xavier": {"nome": "Rui Borges", "clube": "Sporting"}, "Equipa 2": {"nome": "Rui Borges", "clube": "Sporting"}}}};

const POS_ORDER = ["GR","DEF","MED","ATA"];
const POS_LABEL = {GR:"Guarda-Redes", DEF:"Defesas", MED:"Médios", ATA:"Avançados"};

// "_classificacao" é uma chave especial (classificação acumulada da liga),
// não uma ronda — nunca aparece como separador de ronda.
function roundKeys() {
  return Object.keys(DATA).filter(k => k !== "_classificacao");
}

let state = {
  round: roundKeys()[0],
  view: "ranking",
};

function rows() {
  return (DATA[state.round] || {}).jogadores || [];
}

function treinadores() {
  return (DATA[state.round] || {}).treinadores || {};
}

// Os pontos vêm ao vivo da API (Worker), não estão embutidos na página —
// é o admin que os grava em admin.html. Calcula-se aqui a classificação
// (capitão a dobrar) a partir dos pontos + do plantel de cada ronda.
const WORKER_URL = "https://liga-record-pontos.newideas.workers.dev";
let PONTOS = {};       // {"R2": {"Nome|Clube": pontos, ...}, ...}
let pontosCarregados = false;

async function fetchPontos() {
  try {
    const resp = await fetch(`${WORKER_URL}/pontos`);
    PONTOS = await resp.json();
  } catch (e) {
    PONTOS = {};
  }
  pontosCarregados = true;
}

function chaveRonda(round) {
  const m = round.match(/\d+/);
  return "R" + (m ? m[0] : "");
}

// Um jogador marcado "DNP" (não jogou) é substituído pelo suplente da MESMA
// posição que tenha jogado (pontuação numérica). Se não houver suplente
// disponível (já usado, também DNP, ou não existir) esse lugar vale -1. O
// capitão só duplica se for ele próprio a jogar — o bónus não passa para
// quem o substitui.
function calcularEquipaPontos(round) {
  const pontosRonda = PONTOS[chaveRonda(round)] || {};
  const jogadores = (DATA[round] || {}).jogadores || [];
  const pontosDe = j => pontosRonda[`${j.jogador}|${j.clube || ""}`];

  const porEquipa = {};
  for (const j of jogadores) (porEquipa[j.equipa] ??= []).push(j);

  const pontosEquipa = {};
  let pendentes = 0;

  for (const [equipa, plantel] of Object.entries(porEquipa)) {
    let total = 0;
    for (const pos of POS_ORDER) {
      const titulares = plantel.filter(j => j.pos === pos && j.titular)
        .sort((a,b) => (a.slot ?? 99) - (b.slot ?? 99));
      const banco = plantel.filter(j => j.pos === pos && !j.titular);

      for (const tit of titulares) {
        const bruto = pontosDe(tit);
        if (bruto === undefined) { pendentes++; continue; }

        if (bruto !== "DNP") {
          total += tit.capitao ? bruto * 2 : bruto;
          continue;
        }

        // titular não jogou — procurar suplente da mesma posição
        let substituido = false;
        while (banco.length) {
          const cand = banco.shift();
          const candPts = pontosDe(cand);
          if (candPts === undefined) { pendentes++; continue; }
          if (candPts === "DNP") continue;
          total += tit.capitao ? candPts * 2 : candPts;
          substituido = true;
          break;
        }
        if (!substituido) total += -1;
      }
    }
    pontosEquipa[equipa] = total;
  }

  return { pontosEquipa, pendentes };
}

// Detalhe jogador-a-jogador de UMA equipa (para a grelha lado a lado):
// cada linha titular já reflete a substituição (mostra o suplente que
// entrou, se foi caso disso) — mesma lógica de calcularEquipaPontos, mas
// aqui devolvida por jogador em vez de só o total da equipa.
function detalheEquipa(equipa, round) {
  const pontosRonda = PONTOS[chaveRonda(round)] || {};
  const pontosDe = j => pontosRonda[`${j.jogador}|${j.clube || ""}`];
  const chaveDe = j => `${j.jogador}|${j.clube || ""}`;
  const jogadores = ((DATA[round] || {}).jogadores || []).filter(j => j.equipa === equipa);

  const usados = new Set();
  const linhasTitulares = [];
  let total = 0;

  for (const pos of POS_ORDER) {
    const titulares = jogadores.filter(j => j.pos === pos && j.titular)
      .sort((a,b) => (a.slot ?? 99) - (b.slot ?? 99));
    const bancoPos = jogadores.filter(j => j.pos === pos && !j.titular)
      .sort((a,b) => (a.slot ?? 99) - (b.slot ?? 99));

    for (const tit of titulares) {
      const bruto = pontosDe(tit);
      if (bruto === undefined) {
        linhasTitulares.push({ nome: tit.jogador, pontos: null, capitao: tit.capitao });
        continue;
      }
      if (bruto !== "DNP") {
        const pts = tit.capitao ? bruto * 2 : bruto;
        total += pts;
        linhasTitulares.push({ nome: tit.jogador, pontos: pts, capitao: tit.capitao });
        continue;
      }
      let resolvido = false;
      for (const cand of bancoPos) {
        if (usados.has(chaveDe(cand))) continue;
        const candPts = pontosDe(cand);
        if (candPts === undefined) {
          linhasTitulares.push({ nome: cand.jogador, pontos: null, capitao: false });
          usados.add(chaveDe(cand));
          resolvido = true;
          break;
        }
        if (candPts === "DNP") { usados.add(chaveDe(cand)); continue; }
        const pts = tit.capitao ? candPts * 2 : candPts;
        total += pts;
        linhasTitulares.push({ nome: cand.jogador, pontos: pts, capitao: tit.capitao, substituto: true });
        usados.add(chaveDe(cand));
        resolvido = true;
        break;
      }
      if (!resolvido) {
        total += -1;
        linhasTitulares.push({ nome: tit.jogador, pontos: -1, capitao: tit.capitao });
      }
    }
  }

  const bancoRestante = jogadores.filter(j => !j.titular && !usados.has(chaveDe(j)))
    .sort((a,b) => POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos) || (a.slot ?? 99) - (b.slot ?? 99));

  return { linhasTitulares, bancoRestante, total };
}

function rankingRonda() {
  const { pontosEquipa } = calcularEquipaPontos(state.round);
  return Object.entries(pontosEquipa).map(([equipa, pontos]) => ({ equipa, pontos }));
}

function pendentesRonda() {
  return calcularEquipaPontos(state.round).pendentes;
}

function classificacaoGeral() {
  const acumulado = {};
  const rondasContadas = {};
  for (const round of roundKeys()) {
    const { pontosEquipa } = calcularEquipaPontos(round);
    for (const [equipa, pontos] of Object.entries(pontosEquipa)) {
      acumulado[equipa] = (acumulado[equipa] || 0) + pontos;
      rondasContadas[equipa] = (rondasContadas[equipa] || 0) + 1;
    }
  }
  return Object.entries(acumulado).map(([equipa, pontos]) =>
    ({ equipa, pontos, rondas: rondasContadas[equipa] }));
}

function teams() {
  return [...new Set(rows().map(r => r.equipa))];
}

function renderRounds() {
  const el = document.getElementById("rounds");
  el.innerHTML = "";
  roundKeys().forEach(r => {
    const b = document.createElement("button");
    b.className = "round-tab";
    b.textContent = r;
    b.setAttribute("aria-pressed", r === state.round);
    b.onclick = () => { state.round = r; renderAll(); };
    el.appendChild(b);
  });
}

function renderStats() {
  const r = rows();
  const nTeams = teams().length;
  const nPlayers = r.length;
  const nTitulares = r.filter(x => x.titular).length;
  const casa = r.filter(x => x.fixture === "casa").length;
  const fora = r.filter(x => x.fixture === "fora").length;
  const total = casa + fora || 1;
  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="n">${nTeams}</div><div class="l">Equipas</div></div>
    <div class="stat"><div class="n">${nPlayers}</div><div class="l">Jogadores</div></div>
    <div class="stat"><div class="n">${nTitulares}</div><div class="l">Titulares</div></div>
    <div class="stat">
      <div class="n">${casa}<span style="color:var(--text-muted);font-weight:600;">&nbsp;/&nbsp;${fora}</span></div>
      <div class="l">Em casa / Fora</div>
      <div class="split"><span style="width:${100*casa/total}%"></span><span style="width:${100*fora/total}%"></span></div>
    </div>
  `;
}


function rankTableHTML(items, { medal = false } = {}) {
  return items.map((it, i) => `
    <div class="rank-row">
      <div class="rank-pos">${medal && i === 0 ? "🏆" : i + 1}</div>
      <div>
        <div class="rank-name">${it.equipa}</div>
        ${it.rondas ? `<div class="rank-sub">${it.rondas} ronda${it.rondas === 1 ? "" : "s"}</div>` : ""}
      </div>
      <div class="rank-pts">${it.pontos ?? 0}</div>
    </div>`).join("");
}

function renderRanking() {
  const content = document.getElementById("content");

  if (!pontosCarregados) {
    content.innerHTML = `<div class="empty">A carregar pontos…</div>`;
    return;
  }

  const geral = [...classificacaoGeral()].sort((a,b) => (b.pontos ?? 0) - (a.pontos ?? 0));
  const rodada = [...rankingRonda()].sort((a,b) => (b.pontos ?? 0) - (a.pontos ?? 0));
  const pendentes = pendentesRonda();

  content.innerHTML = `
    <div class="rank-refresh"><button id="btnRefreshPontos">🔄 Atualizar pontos</button></div>
    ${pendentes > 0 ? `<div class="pending-note">⚠ ${state.round}: falta pontuação de ${pendentes} jogador${pendentes === 1 ? "" : "es"} — os totais abaixo ainda não são finais.</div>` : ""}
    ${geral.length ? `
      <div class="rank-section">
        <h3>Classificação geral</h3>
        <div class="tablewrap">${rankTableHTML(geral, { medal: true })}</div>
      </div>` : ""}
    ${rodada.length ? `
      <div class="rank-section">
        <h3>${state.round}</h3>
        <div class="tablewrap">${rankTableHTML(rodada)}</div>
      </div>` : `<div class="empty">Sem jogadores nesta ronda.</div>`}
  `;

  document.getElementById("btnRefreshPontos").addEventListener("click", async (e) => {
    e.target.textContent = "A atualizar…";
    await fetchPontos();
    renderRanking();
  });
}

// Cores fixas por coluna de equipa (decorativas, tipo camisola — não é uma
// codificação categórica de dados, por isso não segue a paleta do tema).
const TEAM_COLORS = ["#7FB8E8","#8FD16B","#E8746A","#F27CB0","#F2CB5C","#6FD1C9","#B79CE0","#F2A65C"];

function renderGrelha() {
  const content = document.getElementById("content");
  if (!pontosCarregados) {
    content.innerHTML = `<div class="empty">A carregar pontos…</div>`;
    return;
  }
  const round = state.round;
  const teamsList = teams();
  if (!teamsList.length) {
    content.innerHTML = `<div class="empty">Sem equipas nesta ronda.</div>`;
    return;
  }

  const detalhes = {};
  teamsList.forEach(t => { detalhes[t] = detalheEquipa(t, round); });

  const maxTitulares = Math.max(0, ...teamsList.map(t => detalhes[t].linhasTitulares.length));
  const maxBanco = Math.max(0, ...teamsList.map(t => detalhes[t].bancoRestante.length));
  const treinadoresRound = (DATA[round] || {}).treinadores || {};
  const acumuladoMap = Object.fromEntries(classificacaoGeral().map(g => [g.equipa, g.pontos]));
  const cel = p => (p === null || p === undefined) ? "" : p;

  let html = `<table class="grid-table"><thead><tr>`;
  teamsList.forEach((t, i) => {
    const cor = TEAM_COLORS[i % TEAM_COLORS.length];
    html += `<th class="grid-team" style="background:${cor}" colspan="2">${t}</th>`;
  });
  html += `</tr></thead><tbody>`;

  for (let r = 0; r < maxTitulares; r++) {
    html += `<tr>`;
    teamsList.forEach(t => {
      const l = detalhes[t].linhasTitulares[r];
      html += l
        ? `<td>${l.nome}${l.capitao ? ` <span class="cap-mark">C</span>` : ""}</td><td class="num">${cel(l.pontos)}</td>`
        : `<td></td><td></td>`;
    });
    html += `</tr>`;
  }

  html += `<tr class="grid-coach">`;
  teamsList.forEach(t => { html += `<td>${(treinadoresRound[t] || {}).nome || ""}</td><td></td>`; });
  html += `</tr>`;

  for (let r = 0; r < maxBanco; r++) {
    html += `<tr class="grid-bench">`;
    teamsList.forEach(t => {
      const b = detalhes[t].bancoRestante[r];
      html += `<td>${b ? b.jogador : ""}</td><td></td>`;
    });
    html += `</tr>`;
  }

  html += `<tr class="grid-spacer">${teamsList.map(() => `<td></td><td></td>`).join("")}</tr>`;
  html += `<tr class="grid-total">`;
  teamsList.forEach(t => { html += `<td>Jornada</td><td class="num">${detalhes[t].total}</td>`; });
  html += `</tr>`;
  html += `<tr class="grid-spacer">${teamsList.map(() => `<td></td><td></td>`).join("")}</tr>`;
  html += `<tr class="grid-total">`;
  teamsList.forEach(t => { html += `<td>Acumulado</td><td class="num">${acumuladoMap[t] ?? 0}</td>`; });
  html += `</tr>`;

  html += `</tbody></table>`;
  content.innerHTML = `<div class="tablewrap">${html}</div>`;
}

function renderAll() {
  renderRounds();
  renderStats();
  if (state.view === "grelha") renderGrelha();
  else renderRanking();
}

const VIEW_BUTTONS = { ranking: "viewRanking", grelha: "viewGrelha" };
function setView(view) {
  state.view = view;
  Object.entries(VIEW_BUTTONS).forEach(([v, id]) =>
    document.getElementById(id).setAttribute("aria-pressed", String(v === view)));
  renderAll();
}
document.getElementById("viewGrelha").addEventListener("click", () => setView("grelha"));
document.getElementById("viewRanking").addEventListener("click", () => setView("ranking"));

renderAll();
fetchPontos().then(() => { if (state.view === "ranking") renderRanking(); });
</script>
